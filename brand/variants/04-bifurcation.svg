<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- triagepath — Variant 04 "Bifurcation": one bold line splits, main path solid + alternative dashed -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- incoming bold line -->
    <path d="M50 18 V 48" stroke="#111418" stroke-width="5"/>
    <!-- main (recommended) path, accented, curves right -->
    <path d="M50 48 C 56 66, 64 74, 80 78" stroke="#C58A3C" stroke-width="5"/>
    <!-- alternative path, faint dashed, curves left -->
    <path d="M50 48 C 42 64, 34 70, 22 74" stroke="#111418" stroke-width="3" stroke-dasharray="1 6" opacity="0.4"/>
    <!-- decision node -->
    <circle cx="50" cy="48" r="4.5" fill="#111418" stroke="none"/>
    <!-- terminal on main path -->
    <circle cx="82" cy="78" r="3.5" fill="#C58A3C" stroke="none"/>
  </g>
</svg>
