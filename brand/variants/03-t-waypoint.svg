<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- triagepath — Variant 03 "T Waypoint": letter T crossed by a route, waypoint marks the decision -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- T crossbar -->
    <path d="M22 30 H 78" stroke="#111418" stroke-width="6"/>
    <!-- T stem -->
    <path d="M50 30 V 74" stroke="#111418" stroke-width="6"/>
    <!-- route passing through, deviating right after the waypoint (the path forward) -->
    <path d="M14 78 C 30 78, 34 62, 50 56 C 62 51, 70 48, 82 44" stroke="#C58A3C" stroke-width="4"/>
    <!-- waypoint at the T junction -->
    <circle cx="50" cy="30" r="5" fill="#C58A3C" stroke="none"/>
    <!-- terminal -->
    <circle cx="84" cy="44" r="3" fill="#111418" stroke="none"/>
  </g>
</svg>
