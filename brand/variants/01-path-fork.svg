<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- triagepath — Variant 01 "Path Fork": a route forks, one branch is the recommended path -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- main trunk -->
    <path d="M20 80 C 40 80, 44 66, 50 50" stroke="#111418" stroke-width="5"/>
    <!-- upper branch (recommended, accented) -->
    <path d="M50 50 C 56 34, 62 28, 78 24" stroke="#C58A3C" stroke-width="5"/>
    <!-- lower branch (alternative, faint dashed) -->
    <path d="M50 50 C 58 62, 66 66, 78 66" stroke="#111418" stroke-width="3" stroke-dasharray="1 6" stroke-linecap="round" opacity="0.45"/>
    <!-- waypoint at the decision point -->
    <circle cx="50" cy="50" r="4" fill="#C58A3C" stroke="none"/>
    <!-- terminal node on the recommended path -->
    <circle cx="80" cy="24" r="3.5" fill="#111418" stroke="none"/>
  </g>
</svg>
