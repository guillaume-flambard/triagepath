<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- triagepath — Variant 02 "Sort Lane": nodes converge into a single forward path (triage -> path) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- three incoming lanes converging -->
    <path d="M14 26 C 30 30, 36 40, 42 50" stroke="#111418" stroke-width="3"/>
    <path d="M14 50 C 28 50, 34 50, 40 50" stroke="#111418" stroke-width="3" opacity="0.55"/>
    <path d="M14 74 C 30 70, 36 60, 42 50" stroke="#111418" stroke-width="3" opacity="0.55"/>
    <!-- single outgoing path (the recommendation) -->
    <path d="M42 50 C 56 50, 66 44, 78 40" stroke="#C58A3C" stroke-width="5"/>
    <!-- decision node -->
    <circle cx="42" cy="50" r="4.5" fill="#111418" stroke="none"/>
    <!-- terminal node -->
    <circle cx="80" cy="40" r="3.5" fill="#C58A3C" stroke="none"/>
  </g>
</svg>
