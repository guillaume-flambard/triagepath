<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- triagepath — Variant 05 "Route Dots": waypoints converge then a solid path continues (agentic flow) -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- converging dotted routes -->
    <path d="M16 22 C 30 26, 36 40, 40 50" stroke="#111418" stroke-width="2.5" stroke-dasharray="1 5" opacity="0.5"/>
    <path d="M16 50 C 28 50, 34 50, 40 50" stroke="#111418" stroke-width="2.5" stroke-dasharray="1 5" opacity="0.5"/>
    <path d="M16 78 C 30 74, 36 60, 40 50" stroke="#111418" stroke-width="2.5" stroke-dasharray="1 5" opacity="0.5"/>
    <!-- solid forward path -->
    <path d="M40 50 C 56 50, 68 40, 82 34" stroke="#C58A3C" stroke-width="4.5"/>
    <!-- decision node -->
    <circle cx="40" cy="50" r="4.5" fill="#111418" stroke="none"/>
    <!-- terminal node -->
    <circle cx="84" cy="34" r="3.5" fill="#C58A3C" stroke="none"/>
  </g>
</svg>
